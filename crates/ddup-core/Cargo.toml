[package]
name = "ddup-core"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"] }
chrono = { version = "0.4.44", features = ["serde"] }
sha2 = "0.11.0"
walkdir = "2.5.0"
rayon = "1.10.0"
rusqlite = { version = "0.40.0", features = ["bundled", "chrono"] }
open = "5.3.2"
tracing = "0.1.41"

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.10.1"
pretty_assertions = "1.4.1"

[lints]
workspace = true
